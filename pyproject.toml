[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindrange"
version = "0.6.0"
description = "Range queries over encrypted data stored on blind, decentralized nodes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]
keywords = ["encrypted-database", "searchable-encryption", "structured-encryption",
            "decentralized", "range-queries", "forward-privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Database",
]

# aioquic only buys direct QUIC paths between NAT'd peers; without it the
# relay path still works, so keeping it out of the hard requirements lets a
# platform with no wheel still run a node.
[project.optional-dependencies]
keychain = ["keyring>=24"]
quic = ["aioquic>=1.2"]
all = ["keyring>=24", "aioquic>=1.2"]

[project.scripts]
blindrange = "blindrange.cli:main"
blindrange-node = "blindrange.node:main"

[tool.setuptools]
packages = ["blindrange"]

[tool.setuptools.package-data]
blindrange = ["*.html"]
